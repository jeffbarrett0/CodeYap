# macOS ve Windows kurulum dosyaları. Her platform KENDİ işletim sisteminde derlenmelidir:
# ffmpeg-static kurulum sırasında derlemenin yapıldığı platformun ikilisini indirir.
appId: app.clipforge.desktop
productName: ClipForge
copyright: ClipForge
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/@ffprobe-installer/**
extraResources:
  - from: resources
    to: .
    filter:
      - faster_whisper_cli.py
mac:
  category: public.app-category.video
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
fileAssociations:
  - ext: clipforge
    name: ClipForge projesi
    description: ClipForge projesi
    role: Editor
