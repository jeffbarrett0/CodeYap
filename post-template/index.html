<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post Template</title>
<style>
  /* ====== AYARLAR (buradan oynayabilirsin) ====== */
  :root{
    --bg:#000;
    --text:#fff;
    --muted:#71767b;
    --badge:#1d9bf0;

    /* Reels / TikTok / Shorts arayuzunun kapattigi bolgeler (1080x1920 uzerinde) */
    --safe-top:230px;
    --safe-bottom:430px;
    --safe-side:130px;     /* sol-sag esit: icerik ortada kalir (sagdaki butonlar icin pay) */

    --avatar:92px;
    --name-size:36px;
    --handle-size:30px;
    --body-size:32px;
    --body-line:1.42;
    --body-align:left;     /* left | center */
    --video-radius:22px;
    --gap-header:30px;
    --gap-video:34px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#222}
  body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh}

  .stage{width:1080px;height:1920px;transform-origin:top center;flex:none}
  .canvas{
    width:1080px;height:1920px;background:var(--bg);color:var(--text);
    font-family:"Helvetica Neue",Helvetica,Arial,"Segoe UI",sans-serif;
    padding:var(--safe-top) var(--safe-side) var(--safe-bottom);
    display:flex;flex-direction:column;justify-content:center;
    overflow:hidden;position:relative;
  }

  .profile{display:flex;align-items:center;gap:24px;margin-bottom:var(--gap-header)}
  .avatar{width:var(--avatar);height:var(--avatar);border-radius:50%;flex:none;overflow:hidden;background:#2f3336}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .who{display:flex;flex-direction:column;gap:2px;min-width:0}
  .name-row{display:flex;align-items:center;gap:10px;font-size:var(--name-size);font-weight:700;line-height:1.15}
  .badge{width:calc(var(--name-size)*.95);height:calc(var(--name-size)*.95);flex:none}
  .handle{font-size:var(--handle-size);color:var(--muted);line-height:1.2}

  .body{font-size:var(--body-size);line-height:var(--body-line);font-weight:400;letter-spacing:-.1px;text-align:var(--body-align)}
  .body p+p{margin-top:.75em}

  .video{width:100%;aspect-ratio:16/9;margin-top:var(--gap-video);background:#111;position:relative;flex:none;overflow:hidden;border-radius:var(--video-radius)}
  .video video{width:100%;height:100%;object-fit:cover;display:block}
  .video .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#555;font-size:36px}

  /* ?guides=1 : arayuz bolgelerini kirmizi gosterir (sadece kontrol icin) */
  .guides{display:none;position:absolute;inset:0;pointer-events:none}
  .guides i{position:absolute;background:rgba(255,40,40,.28);border:1px dashed rgba(255,80,80,.9)}
  body.show-guides .guides{display:block}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="canvas">
    <div class="profile">
      <div class="avatar"><img id="avatar" alt=""></div>
      <div class="who">
        <div class="name-row">
          <span id="name"></span>
          <svg class="badge" viewBox="0 0 24 24" aria-label="Verified"><path fill="var(--badge)" d="M22.5 12.5c0-1.58-.88-2.95-2.18-3.66.54-1.4.22-3.04-.89-4.15s-2.75-1.43-4.15-.89C14.58 2.46 13.2 1.5 11.62 1.5S8.67 2.46 7.96 3.8c-1.4-.54-3.04-.22-4.15.89s-1.43 2.75-.89 4.15C1.58 9.55.7 10.92.7 12.5s.88 2.95 2.18 3.66c-.54 1.4-.22 3.04.89 4.15s2.75 1.43 4.15.89c.71 1.34 2.09 2.3 3.67 2.3s2.95-.96 3.66-2.3c1.4.54 3.04.22 4.15-.89s1.43-2.75.89-4.15c1.3-.71 2.18-2.08 2.18-3.66z"/><path fill="#fff" d="M10.5 16.6l-3.4-3.4 1.4-1.4 2 2 5-5 1.4 1.4z"/></svg>
        </div>
        <div class="handle" id="handle"></div>
      </div>
    </div>
    <div class="body" id="text"></div>
    <div class="video" id="video"><div class="ph" id="ph">VIDEO ALANI</div></div>

    <div class="guides">
      <i style="left:0;top:0;width:1080px;height:230px"></i>
      <i style="left:0;top:1490px;width:1080px;height:430px"></i>
      <i style="left:950px;top:230px;width:130px;height:1260px"></i>
      <i style="left:0;top:230px;width:130px;height:1260px"></i>
    </div>
  </div>
</div>

<script>
  /* ====== ICERIK (her gonderide sadece burayi degistir) ====== */
  const CONFIG = {
    name:   "berk",
    handle: "@berkalog",
    avatar: "avatar.webp",   // profil foto yolu (bos ise gri placeholder)
    video:  "clip.mp4",   // video yolu (bos ise placeholder)
    text:
`Galatasaray altyapısında uzun bir aradan sonra pozitif şeyler oluyor.

Eyüp Karasu, Ada Yüzgeç, Cihan Akgün, Furkan Koçak ve daha altyapıdan çıkıp Galatasaray'da uzun yıllar iz bırakabilecek nice gencimiz yetişiyor.

Taraftar olarak çocuklarımızı maçlara giderek & sosyal medya üzerinden elimizden geldiğince desteklememiz gerekiyor.

Ayrıca bu sistemde en büyük pay Fatih Demircan ve teknik direktör Alparslan Erdem'de onları da tebrik etmemiz lazım.`
  };

  document.getElementById('name').textContent   = CONFIG.name;
  document.getElementById('handle').textContent = CONFIG.handle;
  const textEl = document.getElementById('text');
  CONFIG.text.split(/\n\s*\n/).forEach(t => { const p = document.createElement('p'); p.textContent = t.trim(); textEl.appendChild(p); });
  const RENDER = new URLSearchParams(location.search).has('render');
  if (new URLSearchParams(location.search).has('guides')) document.body.classList.add('show-guides');  // MP4 uretimi icin video alani bos birakilir

  const av = document.getElementById('avatar');
  if (CONFIG.avatar) av.src = CONFIG.avatar;
  else av.src = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#2f3336"/><circle cx="50" cy="38" r="18" fill="#6b7075"/><path d="M14 100c0-22 16-34 36-34s36 12 36 34z" fill="#6b7075"/></svg>');

  if (CONFIG.video && !RENDER) {
    const v = document.createElement('video');
    v.src = CONFIG.video; v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true;
    document.getElementById('video').appendChild(v);
    document.getElementById('ph').remove();
  }
  if (RENDER) { const ph=document.getElementById('ph'); if (ph) ph.remove(); document.getElementById('video').style.background='#000'; }

  /* ekrana sigdir (kayit/ekran goruntusu icin ?scale=1 ekle) */
  function fit(){
    const s = new URLSearchParams(location.search).get('scale');
    const k = s ? parseFloat(s) : Math.min(innerWidth/1080, innerHeight/1920, 1);
    const st = document.getElementById('stage');
    st.style.transform = `scale(${k})`;
    st.style.marginBottom = `${-(1920*(1-k))}px`;
  }
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
