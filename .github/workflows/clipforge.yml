name: ClipForge

on:
  pull_request:
    paths: ['clipforge/**']
  workflow_dispatch:
    inputs:
      package:
        description: 'macOS ve Windows kurulum dosyalarını da derle (denenmemiş yapılandırma)'
        type: boolean
        default: false

defaults:
  run:
    working-directory: clipforge

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clipforge/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.package }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clipforge/package-lock.json
      - run: npm ci
      # Her platform kendi işletim sisteminde derlenir (ffmpeg-static platforma özel ikili indirir)
      - run: npm run dist:mac
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run dist:win
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        with:
          name: clipforge-${{ matrix.os }}
          path: clipforge/release/*.*
